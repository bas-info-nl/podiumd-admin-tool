# Weekly dependency updates (design D9). Minor and patch updates are grouped
# per ecosystem to keep the number of PRs manageable; majors arrive one by one.
#
# Cooldown: a version update is only proposed once the release is a week old,
# so a compromised release has time to be noticed and withdrawn (GitHub's own
# default is 3 days). Security updates are not delayed by it.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # The Trivy image for the image scan, the only docker update Dependabot can
  # make: the main Dockerfile takes its base image versions as build args
  # (from .nvmrc and backend/.python-version), which Dependabot cannot resolve,
  # so those digests are bumped by hand together with the version files.
  - package-ecosystem: docker
    directory: /.github/tools/trivy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
