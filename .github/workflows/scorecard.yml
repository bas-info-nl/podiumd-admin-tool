name: Scorecard

# OpenSSF Scorecard: scores the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, dangerous workflows, ...)
# and uploads the findings to the Security tab (code scanning).
#
# It reports on the default branch only, so it does not run on pull requests and
# is not a required check. With `publish_results`, Scorecard only accepts a
# workflow that has no workflow-level write permissions, no workflow-level `env`
# or `defaults`, and a job that uses nothing but the actions below, without
# `run:` steps. Keep it that way.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 05:17 UTC.
    - cron: "17 5 * * 1"
  # Re-score when the branch protection of main changes.
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the results to code scanning.
      security-events: write
      # Sign the published results (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to api.scorecard.dev, which the OpenSSF badge
          # and deps.dev read. The repository is public.
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
