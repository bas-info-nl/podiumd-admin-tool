name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tool versions are not set here: uv comes from backend/pyproject.toml
# ([tool.uv] required-version), Python from backend/.python-version, Node from
# .nvmrc, pre-commit from backend/uv.lock and the hook tools from
# .pre-commit-config.yaml. Local development reads the same files.
env:
  FORCE_COLOR: "1"

# Path gate. On pull requests, `backend` and `frontend` only run when the PR
# touches their area; `changes` decides that with .github/scripts/changed-areas.sh,
# which also documents the area mapping. Push to main and workflow_dispatch
# always run everything, and `hygiene` runs on every event because gitleaks,
# actionlint and pre-commit cover all files.
#
# `on.pull_request.paths` is deliberately not used: backend, frontend and
# hygiene are required status checks on main, and a workflow that does not start
# never reports them, so the PR waits on "Expected" forever. A job skipped by a
# job-level `if:` reports as skipped, which satisfies a required check.
#
# The gated jobs run unless `changes` explicitly answered "false", so a failing
# `changes` job runs the checks instead of silently skipping them.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its first parent (the base branch tip).
          fetch-depth: 2

      - name: Detect changed areas
        id: areas
        run: .github/scripts/changed-areas.sh

  backend:
    name: backend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: import-linter
        run: uv run lint-imports --no-cache

      - name: pytest + coverage
        run: uv run pytest

      - name: Coverage gate (>= 85% on domain and application)
        run: >-
          uv run coverage report
          --include="src/podiumd_admin/domain/*,src/podiumd_admin/application/*"
          --fail-under=85

      - name: pip-audit
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: prettier --check
        run: npm run format:check

      - name: tsc --noEmit
        run: npm run typecheck

      - name: vitest + coverage
        run: npm run test:coverage

      - name: npm audit
        run: npm audit

      - name: e2e scaffold (install, typecheck, audit)
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npm audit

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the full history.
          fetch-depth: 0

      # Tests the path gate here rather than in `changes`: hygiene is a required
      # check, so a broken gate blocks the merge instead of only failing open.
      - name: Test the path gate (changed-areas.sh)
        run: .github/scripts/test-changed-areas.sh

      - name: Test the PR feedback wait (wait-for-pr-feedback.sh)
        run: .github/scripts/test-wait-for-pr-feedback.sh

      # pre-commit is locked in backend/uv.lock, and the ruff, prettier and
      # eslint hooks use the locked backend and frontend tools.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend and frontend tools
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && npm ci)

      # pre-commit skips .claude/, so the agent setup has its own tests: the
      # role files, the shared settings and the workflow script's control flow.
      - name: Test the agent setup (.claude/tests)
        run: node --test ".claude/tests/*.test.mjs"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # Python hook environments are built with the locked pre-commit and
          # the backend's Python, so those are part of the key too.
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'backend/uv.lock', 'backend/.python-version') }}

      # The gitleaks version is the hook rev in .pre-commit-config.yaml.
      - name: gitleaks (full history)
        run: uv run --project backend --locked pre-commit run gitleaks-history --hook-stage manual

      - name: actionlint
        run: uv run --project backend --locked pre-commit run actionlint --all-files

      - name: hadolint
        if: ${{ hashFiles('**/Dockerfile', '**/*.Dockerfile') != '' }}
        run: uv run --project backend --locked pre-commit run hadolint --all-files

      - name: pre-commit run --all-files
        env:
          # Already run above; the gitleaks hook only scans staged changes.
          SKIP: actionlint,hadolint,gitleaks
        run: uv run --project backend --locked pre-commit run --all-files --show-diff-on-failure
