# Alembic configuration for the PodiumD Admin Tool database (design D4, D8).
#
# Migrations run as the owner role (podiumd_admin_owner), never as the app
# role. The connection URL comes from the PODIUMD_ADMIN_DATABASE_OWNER_URL
# environment variable, so no credentials live in this file:
#
#   PODIUMD_ADMIN_DATABASE_OWNER_URL=postgresql+psycopg://podiumd_admin_owner:...@host/db \
#     uv run alembic upgrade head
#
# The migrations ship inside the package, so the image can run them.

[alembic]
script_location = podiumd_admin.adapters.db:migrations
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
