# pre-commit itself is a backend dev dependency, so its version is locked in
# backend/uv.lock and CI and local runs use the same one:
#   uv run --project backend --locked pre-commit install  (once, see README.md)
#   uv run --project backend --locked pre-commit run --all-files
# Hook repositories are pinned to commit SHAs; this file is the only place that
# sets the gitleaks, actionlint, zizmor, hadolint and shellcheck versions, also
# for CI.
# Update with `uv run --project backend --locked pre-commit autoupdate --freeze`.
#
# The ruff, prettier and eslint hooks run the versions locked in backend/uv.lock
# and frontend/package-lock.json, so local hooks and CI never disagree. They
# need `uv` and `npm ci` in frontend/ first.
#
# A floor for config compatibility only; the version used is the locked one.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit]
# .claude/ is Claude Code configuration; LICENSE is kept verbatim.
exclude: ^(\.claude/|LICENSE$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --project backend --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true
      - id: prettier
        name: prettier
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json, yaml, markdown]
        require_serial: true
      - id: eslint
        name: eslint (frontend)
        # eslint runs from frontend/ so it finds its flat config and tsconfig.
        entry: bash -c 'cd frontend && exec node_modules/.bin/eslint --max-warnings=0 --fix "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        require_serial: true
      - id: node-engines
        name: package.json engines match .nvmrc
        entry: .github/scripts/check-node-engines.sh
        language: system
        files: ^(\.nvmrc|(frontend|e2e)/package(-lock)?\.json)$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
      # The same gitleaks over the full git history, for the hygiene job:
      #   pre-commit run gitleaks-history --hook-stage manual
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (full history)
        entry: gitleaks git --redact --verbose
        always_run: true
        stages: [manual]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb # frozen: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Security audit of the workflows, dependabot.yml and this file: unpinned
  # actions, script injection, excessive permissions, credential persistence.
  # --offline keeps the required hygiene check independent of the GitHub API;
  # it skips the audits that look actions up online.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        args: [--offline, --no-progress]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
